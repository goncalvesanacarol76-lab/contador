<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caixinhas - Opala Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/logo.ico">
    <!-- Fonte adicional com estilo místico/mágico -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="magical-glow"></div>
    <h1>✨ Contagem de Caixinhas da Opala Store ✨</h1>
    
    <div class="container">
        <div class="card" data-id="bia">
            <img src="assets/bia-contador.jpeg" alt="Foto da Bia">
            <h3>Bia</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="jheni">
            <img src="assets/jheni.jpg" alt="Foto da Jheni">
            <h3>Jheni</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="yasmin">
            <img src="assets/" alt="Foto da Yasmin">
            <h3>Yasmin</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="nicole">
            <img src="assets/33.jpg" alt="Foto da Nicole">
            <h3>Nicole</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="anacarol">
            <img src="assets/ana-contador.jpeg" alt="Foto da Ana Carol">
            <h3>Ana Carol</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="anaclara">
            <img src="assets/ana-clara.jpg" alt="Foto da Ana Clara">
            <h3>Ana Clara</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="tina">
            <img src="assets/22.jpg" alt="Foto da Tina">
            <h3>Tina</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>

        <div class="card" data-id="maria">
            <img src="assets/maria-contador.jpeg" alt="Foto da Maria">
            <h3>Maria</h3>
            <div class="contador">0</div>
            <button class="btn-add">🔮 Adicionar</button>
            <button class="btn-reset">Zerar</button>
            <button class="btn-sub">-1 (Desfazer)</button>
        </div>
    </div>

    <!-- Seção de Caixinhas Conferidas (Ana Carol e Jheni) -->
  <div class="conferencia-section">
        <h2>✨ Contagem de Caixinhas Conferidas ✨</h2>
        <div class="conferencia-container">
            <div class="conf-card" data-id="conf-anacarol">
                <h3>Ana Carol</h3>
                <img src="assets/ana-contador.jpeg" alt="Foto da Ana Carol">
                <div class="contador-conf">0</div>
                <div class="conf-botoes">
                    <button class="btn-conf-sub">-1</button>
                    <button class="btn-conf-add">+1</button>
                </div>
                <button class="btn-conf-reset">Zerar</button>
            </div>

            <div class="conf-card" data-id="conf-jheni">
                <h3>Jheni</h3>
                <img src="assets/jheni.jpg" alt="Foto da Jheni">
                <div class="contador-conf">0</div>
                <div class="conf-botoes">
                    <button class="btn-conf-sub">-1</button>
                    <button class="btn-conf-add">+1</button>
                </div>
                <button class="btn-conf-reset">Zerar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
